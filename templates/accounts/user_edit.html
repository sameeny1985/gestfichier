{% extends "base.html" %}
{% block title %}Modifier utilisateur{% endblock %}
{% block content %}
<div class="container" style="max-width: 640px;">
    <h1 class="h3 mb-4"><i class="bi bi-person-gear"></i> Modifier : {{ target.email }}</h1>

    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">E-mail (identifiant de connexion)</label>
                    <input type="email" name="email" class="form-control" value="{{ target.email }}" required>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Prénom</label>
                        <input type="text" name="first_name" class="form-control" value="{{ target.first_name }}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nom</label>
                        <input type="text" name="last_name" class="form-control" value="{{ target.last_name }}">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Téléphone</label>
                    <input type="text" name="phone" class="form-control" value="{{ target.phone }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Rôle</label>
                    <select name="role" class="form-select">
                        {% for value, label in roles %}
                        <option value="{{ value }}" {% if target.role == value %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Quota de stockage (Mo)</label>
                    <input type="number" name="storage_quota_mb" class="form-control" value="{{ target.storage_quota_mb }}" min="1">
                </div>
                <div class="form-check mb-4">
                    <input type="checkbox" name="is_active" class="form-check-input" id="isActive" {% if target.is_active %}checked{% endif %}>
                    <label class="form-check-label" for="isActive">Compte actif</label>
                </div>

                <hr>
                <h5 class="mb-3">Changer le mot de passe</h5>
                <p class="text-muted small">Laissez vide pour ne pas changer. L'ancien mot de passe ne peut pas être affiché.</p>
                <div class="mb-3">
                    <label class="form-label">Nouveau mot de passe</label>
                    <input type="password" name="new_password" class="form-control" autocomplete="new-password">
                </div>
                <div class="mb-3">
                    <label class="form-label">Confirmer le mot de passe</label>
                    <input type="password" name="new_password2" class="form-control" autocomplete="new-password">
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Enregistrer</button>
                    <a href="{% url 'accounts:user_list' %}" class="btn btn-outline-secondary">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
