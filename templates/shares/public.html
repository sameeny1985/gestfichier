{% load i18n %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fichier partagé — GestFichier</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body text-center p-5">
                        <i class="bi bi-file-earmark-arrow-down display-3 text-primary"></i>
                        <h3 class="mt-3">{{ share.file_item.name }}</h3>
                        <p class="text-muted">Partagé par {{ share.created_by.get_full_name|default:share.created_by.email }}</p>
                        <p>Taille : {{ share.file_item.size_human }}</p>
                        {% if share.allow_download %}
                        <a href="?download=1" class="btn btn-primary btn-lg mt-3">
                            <i class="bi bi-download"></i> Télécharger
                        </a>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
