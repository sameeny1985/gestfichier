<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mot de passe requis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h4 class="text-center mb-3">Lien protégé</h4>
                        <p class="text-muted text-center small">Ce fichier est protégé par un mot de passe.</p>
                        <form method="post">
                            {% csrf_token %}
                            <input type="password" name="password" class="form-control mb-3" placeholder="Mot de passe" required autofocus>
                            <button type="submit" class="btn btn-primary w-100">Accéder</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
